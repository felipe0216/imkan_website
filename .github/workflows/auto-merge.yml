# Solo-maintainer flow: keep PRs (history + CI preview), skip human review.
# When an allowed author opens a PR, enable squash auto-merge once checks pass.
name: Auto-merge maintainer PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Azure Static Web Apps CI/CD"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    # workflow_run: only act on successful PR builds targeting main
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ALLOWED_AUTHORS = new Set(['felipe0216', 'felipearaya']);

            async function resolvePullRequest() {
              if (context.payload.pull_request) {
                return context.payload.pull_request;
              }

              const branch = context.payload.workflow_run.head_branch;
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`,
              });

              return pulls[0] ?? null;
            }

            const pr = await resolvePullRequest();
            if (!pr) {
              core.info('No open pull request found; skipping.');
              return;
            }

            if (pr.draft) {
              core.info(`PR #${pr.number} is a draft; skipping.`);
              return;
            }

            if (!ALLOWED_AUTHORS.has(pr.user.login)) {
              core.info(`PR #${pr.number} author ${pr.user.login} is not in the auto-merge allowlist.`);
              return;
            }

            if (pr.merged || pr.mergeable_state === 'closed') {
              core.info(`PR #${pr.number} is already closed or merged.`);
              return;
            }

            // Best-effort approval (helps if branch protection still asks for 1 review).
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: 'Auto-approved for solo maintainer workflow.',
              });
              core.info(`Approved PR #${pr.number}.`);
            } catch (error) {
              core.info(`Approve skipped for PR #${pr.number}: ${error.message}`);
            }

            // Enable squash auto-merge; GitHub merges when required checks are green.
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(
                    input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                  ) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullRequestId: pr.node_id }
              );
              core.info(`Auto-merge enabled for PR #${pr.number}.`);
            } catch (error) {
              core.info(`Auto-merge not enabled for PR #${pr.number}: ${error.message}`);
              core.info('Ensure repo Settings → General → Allow auto-merge is enabled.');
            }
