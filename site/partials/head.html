<!-- start.mjs brand --page software --bg "#efece5" --surface "#e3ded3" --ink "#1b111d" --muted "#4c4150" --accent "#5e1654" --type funnel (as printed; D-018, D-022) -->
<style>
:root {
  --p-bg: #efece5; --p-surface: #e3ded3; --p-ink: #1b111d; --p-muted: #4c4150;
  --p-accent: #5e1654; --p-accent-ink: #efece5; --p-action: #5e1654; --p-action-ink: #efece5;
  --p-inv-bg: #1b111d; --p-inv-surface: #271d29; --p-inv-ink: #efece5; --p-inv-muted: #979092;
  --p-inv-accent: #efece5; --p-inv-accent-ink: #1b111d; --p-inv-action: #efece5; --p-inv-action-ink: #1b111d;
  --font-display: "Funnel Display", system-ui, sans-serif;
  --font-text: "Funnel Sans", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 400;
  --display-tracking: -0.03em;
  --display-tracking-xl: -0.04em;
  --ly-scale: 0.98;
}
</style>
<!-- D-020: the saffron-gold highlight and a lighter muted on the dark band (the one deviation from the printed block) -->
<style>
:root {
  --p-inv-muted: #cbbccf;
  --p-inv-accent: #ffc233; --p-inv-accent-ink: #1b111d;
  --p-inv-action: #ffc233; --p-inv-action-ink: #1b111d;
}
</style>
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
