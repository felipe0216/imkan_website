<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-ground="sand" data-buttons="tonal" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Generated by scripts/build-legal.mjs from content/{{slug}}.md and templates/legal.html: edit those, not this file. -->
<!-- Remove at cut-over (ADR 0004): keeps preview builds out of search engines. -->
<title>{{title}} | Imkan.ai</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}} | Imkan.ai">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://imkan.ai/{{slug}}/">
<meta property="og:url" content="https://imkan.ai/{{slug}}/">
<!-- @include partials/head.html -->
<link rel="stylesheet" href="/styles/legal.css">
</head>
<body>
<!-- type: software (AI; ADR 0009). Legal page (D-027): a plain reading page, no dealt moment (moment-none accepted
     here), no scene. The text is the old site's, word for word (content/{{slug}}.md). -->

<!-- @include partials/nav.html -->

<main id="top">
  <section class="section legal" aria-labelledby="legal-h">
    <div class="wrap grid grid--top">
      <header class="span-12 legal__head">
        <h1 id="legal-h">{{title}}</h1>
        <p class="muted">{{updated}}</p>
      </header>
      <nav class="span-3 legal__toc" aria-label="Contents">
        <p class="t-label muted">Contents</p>
        <ol>{{toc}}</ol>
      </nav>
      <article class="span-8 start-5 legal__body">
{{body}}
      </article>
    </div>
  </section>
</main>

<!-- @include partials/footer.html -->

<script type="module" src="/assets/system.js"></script>
<script type="module" src="/assets/motion/motion.js"></script>
<script type="module" src="/assets/layout/layout.js"></script>
</body>
</html>
