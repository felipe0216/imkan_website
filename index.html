<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imkan.ai - Engineering Excellence</title>
    <meta name="description" content="Saudi Arabia's premier AI and data engineering consultancy. We deliver production-grade data platforms, agentic AI, and intelligent automation aligned with Vision 2030. Elite engineering in weeks, not quarters.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/svg+xml" href="/favicon-512.svg">
    <link rel="apple-touch-icon" href="/favicon-512.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#25e2f4",
              "accent-green": "#a3e635",
              "background-light": "#f5f8f8",
              "background-dark": "#0A0F14",
              "background-card": "#162024",
              "surface-dark": "#132325",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "sans": ["Space Grotesk", "sans-serif"],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #25e2f41a 1px, transparent 1px), linear-gradient(to bottom, #25e2f41a 1px, transparent 1px)",
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 4s linear infinite',
              'beam': 'beam 3s linear infinite',
              'shimmer': 'shimmer 2s infinite',
              'text-gradient': 'text-gradient 5s ease infinite',
              'fadeIn': 'fadeIn 0.6s ease-out',
            },
            keyframes: {
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              },
              beam: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '50%': { opacity: '1' },
                '100%': { transform: 'translateY(100%)', opacity: '0' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              'text-gradient': {
                '0%, 100%': { backgroundSize: '200% 200%', backgroundPosition: 'left center' },
                '50%': { backgroundSize: '200% 200%', backgroundPosition: 'right center' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              }
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-background-dark text-white font-display overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
