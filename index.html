<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imkan.ai - Engineering Excellence</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#25e2f4",
              "accent-green": "#a3e635",
              "background-light": "#f5f8f8",
              "background-dark": "#0A0F14",
              "background-card": "#162024",
              "surface-dark": "#132325",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "sans": ["Space Grotesk", "sans-serif"],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #25e2f41a 1px, transparent 1px), linear-gradient(to bottom, #25e2f41a 1px, transparent 1px)",
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 4s linear infinite',
              'beam': 'beam 3s linear infinite',
              'shimmer': 'shimmer 2s infinite',
              'text-gradient': 'text-gradient 5s ease infinite',
            },
            keyframes: {
              scan: {
                '0%': { top: '0%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0' },
              },
              beam: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '50%': { opacity: '1' },
                '100%': { transform: 'translateY(100%)', opacity: '0' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              'text-gradient': {
                '0%, 100%': { backgroundSize: '200% 200%', backgroundPosition: 'left center' },
                '50%': { backgroundSize: '200% 200%', backgroundPosition: 'right center' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0F14;
      }
      ::-webkit-scrollbar-thumb {
        background: #223033;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #25e2f4;
      }

      /* Glassmorphism Utilities */
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-nav {
        background: rgba(10, 15, 20, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(37, 226, 244, 0.1);
      }

      .hero-glow {
        background: radial-gradient(circle at center, rgba(37, 226, 244, 0.15) 0%, rgba(10, 15, 20, 0) 70%);
      }
      
      .text-glow {
        text-shadow: 0 0 20px rgba(37, 226, 244, 0.3);
      }

      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }

      /* Spotlight Effect Helper */
      .spotlight-card {
        position: relative;
        overflow: hidden;
      }
      .spotlight-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(37, 226, 244, 0.08), transparent 40%);
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      .spotlight-card:hover::before {
        opacity: 1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-background-dark text-white font-display overflow-x-hidden antialiased">
    <div id="root"></div>
  </body>
</html>
