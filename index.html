<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imkan.ai - Engineering Excellence</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background-dark": "#001f24",
              "background-card": "#002b32",
              "primary": "#00f3ff", /* Neon Cyan */
              "accent-green": "#ccff00", /* Acid Green */
              "surface-dark": "#003840",
              "text-muted": "#94a3b8",
            },
            fontFamily: {
              "display": ["IBM Plex Sans", "sans-serif"],
              "sans": ["IBM Plex Sans", "sans-serif"],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #00f3ff0d 1px, transparent 1px), linear-gradient(to bottom, #00f3ff0d 1px, transparent 1px)",
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #001f24;
      }
      ::-webkit-scrollbar-thumb {
        background: #004d57;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }

      /* Glassmorphism Utilities */
      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      
      .glass-nav {
        background: rgba(0, 31, 36, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      }

      .hero-glow {
        background: radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, rgba(0, 31, 36, 0) 60%);
      }
      
      .text-glow {
        text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
      }
      
      .neon-border:hover {
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        border-color: rgba(0, 243, 255, 0.4);
      }

      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24
      }
      
      body {
        background-color: #001f24;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-background-dark text-white font-sans overflow-x-hidden antialiased">
    <div id="root"></div>
  </body>
</html>
